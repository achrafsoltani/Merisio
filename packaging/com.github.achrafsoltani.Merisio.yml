app-id: com.github.achrafsoltani.Merisio
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
# PySide6 comes from Flathub's PySide base app, built for this KDE runtime
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: merisio

build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
    - BASEAPP_DISABLE_NUMPY=1

cleanup-commands:
  - /app/cleanup-BaseApp.sh

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home

modules:
  - name: merisio
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/merisio
      - cp -r src main.py cli.py /app/share/merisio/
      - install -Dm755 merisio /app/bin/merisio
      - install -Dm755 merisio-cli /app/bin/merisio-cli
      - install -Dm644 packaging/merisio.desktop /app/share/applications/com.github.achrafsoltani.Merisio.desktop
      - install -Dm644 packaging/com.github.achrafsoltani.Merisio.metainfo.xml /app/share/metainfo/com.github.achrafsoltani.Merisio.metainfo.xml
      - install -Dm644 resources/icons/app_icon.png /app/share/icons/hicolor/256x256/apps/com.github.achrafsoltani.Merisio.png
      - install -Dm644 LICENSE /app/share/licenses/com.github.achrafsoltani.Merisio/LICENSE
    sources:
      # Builds the checked-out tree. For a Flathub submission, replace this source
      # with: type: git, url: https://github.com/achrafsoltani/Merisio.git,
      # tag: vX.Y.Z and commit: <that tag's commit>.
      - type: dir
        path: ..
        skip:
          - .git
          - .venv
          - build
          - dist
          - .flatpak-builder
      - type: script
        dest-filename: merisio
        commands:
          - exec python3 /app/share/merisio/main.py "$@"
      - type: script
        dest-filename: merisio-cli
        commands:
          - exec python3 /app/share/merisio/cli.py "$@"
